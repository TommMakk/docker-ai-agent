services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 8070:8000
    command: uvicorn main:app --host 0.0.0.0 --port 8000
    environment:
      - PORT=8000
      - MY_PROJECT=Hello World
    env_file:
      - .env
    volumes:
      - ./backend/src:/app
    depends_on:
      - db_service
      - ollama
    develop:
      watch:
      - action: rebuild
        path: backend/requirements.txt
      - action: rebuild
        path: backend/Dockerfile
      - action: restart
        path: backend/src/

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11435:11434"  # Changed: Host 11435 -> Container 11434 (avoids port conflict)
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped

  db_service:
    image: postgres:17.5
    ports:
      - 5432:5432
    environment:
      - POSTGRES_USER=dbuser
      - POSTGRES_PASSWORD=db-password
      - POSTGRES_DB=mydb
    volumes:
      - dc_managed_db_data:/var/lib/postgresql/data

volumes:
  dc_managed_db_data:
  ollama_data:
